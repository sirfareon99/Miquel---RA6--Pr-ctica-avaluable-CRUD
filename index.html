<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <title>Gestión de Préstamos de Material</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4 text-center">Gestión de Préstamos de Material</h1>

        <div class="mb-4">
            <label for="nombre_alumno">Nombre del alumno:</label>
            <input type="text" id="nombre_alumno" class="form-control" placeholder="Nombre y apellidos">
        </div>

        <div class="mb-3">
            <label for="material">Material:</label>
            <select id="material" class="form-select">
                <option value="">Selecciona un material</option>
                <option value="Cargador">Cargador</option>
                <option value="Ratón">Ratón</option>
                <option value="Portátil">Portátil</option>
                <option value="Otros">Otros</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Turno:</label><br>
            <input type="radio" name="turno" id="turno_manana" value="Mañana">
            <label for="turno_manana">Mañana</label>
            
            <input type="radio" name="turno" id="turno_tarde" value="Tarde" class="ms-3">
            <label for="turno_tarde">Tarde</label>
        </div>

        <div class="mb-3">
            <input type="checkbox" id="devuelto">
            <label for="devuelto">Ya ha sido devuelto</label>
        </div>

        <button id="boton_guardar" class="btn btn-outline-info">Añadir préstamo</button>
    </div>

    <div class="container mt-5">
        <h2>Lista de préstamos</h2>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Alumno</th>
                    <th>Material</th>
                    <th>Turno</th>
                    <th>Devuelto</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpo_tabla_prestamos"></tbody>
        </table>
    </div>

    <script src="crud.js"></script>
</body>
</html>
